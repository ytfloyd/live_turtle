[project]
name = "turtle-crypto"
version = "0.1.0"
description = "Turtle Trading system for crypto, executed against Coinbase Advanced"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "tabulate>=0.9.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turtle_crypto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --ignore=tests/integration"
markers = [
    "integration: integration tests that hit the live Coinbase API (require --integration)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
